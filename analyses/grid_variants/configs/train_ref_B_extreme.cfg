# Grid B (ref), extreme preset: retrains the full AutoGluon pool on the
# alternative held-out grid built by analyses/grid_variants/build_splits.py.
# Paper settings (4 h budget, 8 bagging folds, 1 GPU). Run from the repo root:
#   python scripts/train/run.py --flagfile=analyses/grid_variants/configs/train_ref_B_extreme.cfg
--flagfile=scripts/train/config.cfg
--train_csv=outputs/analyses/grid_variants/ref_B/train_damage.csv
--test_csv=outputs/analyses/grid_variants/ref_B/test_damage.csv
--presets=extreme
--hyperparameters=zeroshot_2025_tabfm
--time_limit=14400
--num_cpus=24
--num_cpus_per_fold=12
--num_gpus=1
--num_gpus_per_fold=1
--output_dir=outputs/analyses/grid_variants/models/ref_B/extreme

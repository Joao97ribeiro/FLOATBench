# ================================
# Input Data
# ================================
# Per-row pool predictions: <pred_dir>/<protocol>/<group>_<preset>.parquet
--pred_dir=outputs/analyses/predictions
--protocols=e1,e2,e3

# ================================
# Bootstrap settings (paper settings)
# ================================
--top_n=10
--n_bootstrap=2000
--bootstrap_seed=42
# Also run the row-level i.i.d. bootstrap to report the std ratio
--also_row=True

# ================================
# Output options
# ================================
--output_dir=outputs/analyses/cluster_bootstrap

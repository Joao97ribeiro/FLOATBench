# ================================
# Test Data
# ================================
--test_csv=data/ref/test_damage.csv
# Training labels: enable the full-envelope lifetime damage error.
--train_csv=data/ref/train_damage.csv

# ================================
# Model Trained
# ================================
--model_cfg_path=outputs/within/ref/best/model/autogluon_meta.json

# ================================
# Bootstrap uncertainty quantification (paper settings)
# ================================
--bootstrap=True
--n_bootstrap=2000
--bootstrap_seed=42
--bootstrap_alpha=0.05
# Resample whole operating conditions (condition-level bootstrap).
# Use "row" for the original row-level i.i.d. bootstrap.
--bootstrap_cluster=condition

# ================================
# Design metrics (non-conservative share, lifetime damage error)
# ================================
--nonconservative_min_wind=10.0
--nonconservative_tol=0.1

# Grid B (ref), best preset: retrains the full AutoGluon pool on the
# alternative held-out grid built by scripts/analyses/grid_variants_split.
# Benchmark settings (4 h budget, 8 bagging folds, 1 GPU). Run from the
# repository root:
#   python scripts/train/run.py \
#       --flagfile=scripts/analyses/grid_variants/train_ref_B_best.cfg

# ================================
# Base configuration
# ================================
--flagfile=scripts/train/config.cfg

# ================================
# Train / test data
# ================================
--train_csv=outputs/analyses/grid_variants/ref_B/train_damage.csv
--test_csv=outputs/analyses/grid_variants/ref_B/test_damage.csv

# ================================
# Autogluon hyperparameters
# ================================
--presets=best
--hyperparameters=zeroshot
--time_limit=14400
--num_cpus=24
--num_cpus_per_fold=12
--num_gpus=1
--num_gpus_per_fold=1

# ================================
# Output options
# ================================
--output_dir=outputs/analyses/grid_variants/models/ref_B/best

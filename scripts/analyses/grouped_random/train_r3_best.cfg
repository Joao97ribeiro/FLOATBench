# Condition-grouped random split r3 (ref), best preset, built by
# scripts/analyses/grouped_random_split. The zeroshot portfolio is used
# for both presets of this experiment. Run from the repository root:
#   python scripts/train/run.py \
#       --flagfile=scripts/analyses/grouped_random/train_r3_best.cfg

# ================================
# Base configuration
# ================================
--flagfile=scripts/train/config.cfg

# ================================
# Train / test data
# ================================
--train_csv=outputs/analyses/grouped_random/ref_r3/train_damage.csv
--test_csv=outputs/analyses/grouped_random/ref_r3/test_damage.csv

# ================================
# Autogluon hyperparameters
# ================================
--presets=best
--hyperparameters=zeroshot
--time_limit=14400
--num_cpus=24
--num_cpus_per_fold=12
--num_gpus=1
--num_gpus_per_fold=1

# ================================
# Output options
# ================================
--output_dir=outputs/analyses/grouped_random/models/ref_r3/best
